name: Tests

on:
  push:
    branches: [ main, gh-pages ]
  pull_request:
    branches: [ main, gh-pages ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Git identity
      run: |
        git config --global user.email "test@example.com"
        git config --global user.name "Test User"

    - name: Install BATS
      run: |
        git clone https://github.com/bats-core/bats-core.git
        cd bats-core
        sudo ./install.sh /usr/local

    - name: Install yq
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod a+x /usr/local/bin/yq

    - name: Install kcov
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ pkg-config jq libcurl4-openssl-dev libelf-dev libdw-dev
        wget https://github.com/SimonKagstrom/kcov/archive/master.tar.gz
        tar xzf master.tar.gz
        cd kcov-master
        mkdir build
        cd build
        cmake ..
        make
        sudo make install

    - name: Run tests with coverage
      run: |
        # Create coverage directory
        mkdir -p coverage
        # Run tests with kcov, excluding BATS framework
        kcov --include-path=$GITHUB_WORKSPACE --exclude-pattern=bats-core coverage bats test/install.bats

    - name: Upload coverage to Codecov
      if: env.CODECOV_TOKEN != ''
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/coverage.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false 