name: Tests

on:
  push:
    branches: [ main, gh-pages ]
  pull_request:
    branches: [ main, gh-pages ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install BATS
      run: |
        git clone https://github.com/bats-core/bats-core.git
        cd bats-core
        sudo ./install.sh /usr/local

    - name: Install kcov
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ pkg-config jq libcurl4-openssl-dev libelf-dev libdw-dev
        wget https://github.com/SimonKagstrom/kcov/archive/master.tar.gz
        tar xzf master.tar.gz
        cd kcov-master
        mkdir build
        cd build
        cmake ..
        make
        sudo make install

    - name: Debug directory structure
      run: |
        echo "Current directory: $(pwd)"
        echo "Listing contents of workspace:"
        ls -la
        echo "Listing contents of test directory:"
        ls -la test/
        echo "Checking if test/install.bats exists:"
        test -f test/install.bats && echo "File exists" || echo "File does not exist"
        echo "File permissions:"
        ls -l test/install.bats || echo "File not found"

    - name: Run tests with coverage
      run: |
        cd "$GITHUB_WORKSPACE"
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        echo "Current directory: $(pwd)"
        echo "Full path to test file: $GITHUB_WORKSPACE/test/install.bats"
        echo "Verifying file exists at full path:"
        test -f "$GITHUB_WORKSPACE/test/install.bats" && echo "File exists at full path" || echo "File does not exist at full path"
        echo "File contents:"
        cat test/install.bats
        echo "Running kcov with absolute path:"
        if [ -n "$CODECOV_TOKEN" ]; then
          kcov --coveralls-id=$GITHUB_RUN_ID --exclude-pattern=bats-core,tests coverage "$GITHUB_WORKSPACE/test/install.bats"
        else
          echo "Codecov token not found, running kcov without coverage reporting"
          kcov --exclude-pattern=bats-core,tests coverage "$GITHUB_WORKSPACE/test/install.bats"
        fi

    - name: Upload coverage to Codecov
      if: env.CODECOV_TOKEN != ''
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/coverage.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false 